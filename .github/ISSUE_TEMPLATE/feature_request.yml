name: Feature request
description: Suggest a change to a pr-gate component.
labels: [enhancement]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: codex-gate is frozen at 0.3.1, so new work goes to pr-lifecycle.
      options:
        - pr-lifecycle
        - codex-gate
        - repo tooling or docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The component version you are using.
      placeholder: pr-lifecycle 1.0.0
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The problem it solves and the behavior you have in mind.
    validations:
      required: true
